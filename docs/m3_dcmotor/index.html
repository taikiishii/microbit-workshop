# 🔄 DCモーターを回そう

回す・止める・向きと速さを変えよう

---

# なにをするの？

:::

**DCモーター** は、電気を流すと **ぐるぐる回り続ける** モーターだよ。扇風機や、おもちゃの車にも入っているんだ。

- 電気の **向き** を逆にすると、**逆に回る**
- 電気の **強さ** で、**速さ** が変わる

今回は、**130 サイズ** という小さなモーターを **2つ** 使うよ。

:::

📷 ここに 130 サイズの DCモーターの写真：線がはんだ付けしてあるものを2つ

---

# モーターをつなごう

:::

1台目を **M1**、2台目を **M2** につなぐよ。

1. 小さいドライバーで、M1 の **1A+** と **1A−** のねじをゆるめる
2. モーターの2本の線を、それぞれの穴に差しこむ
3. ねじをしめて、軽く引っぱっても抜けないか確かめる
4. 2台目も同じように、M2 の **1B+** と **1B−** につなぐ

> 2本の線は、どちらをどちらに入れてもOK。回る向きが逆になるだけだよ。

:::

📷 ここに M1 と M2 にモーターをつないだ写真：ねじの端子に線が入っているところ

---

# 回して、止めよう

:::

1. 「**ボタンAが押されたとき**」に「**モーター M1 を 正転 方向に スピード 150 で回す**」を入れる
2. 「**ボタンBが押されたとき**」に「**モーター M1 を止める**」を入れる
3. 書きこんで、基板のスイッチを **ON** にする
4. A で回って、B で止まるかな？

> 「**正転**」を「**逆転**」に変えると、逆向きに回るよ。

:::

📷 ここにメイクコードの画面：ボタンA に「モーター M1 を 正転 方向に スピード 150 で回す」、ボタンB に「モーター M1 を止める」

---

# スピードを変えてみよう

:::

スピードは **0〜255** の数で決めるよ。大きいほど速く回る。

1. スピードを **255** にして、いちばん速い回り方を見る
2. スピードを **50** にして、ためしてみる
3. 回り出せる、いちばん小さい数をさがしてみよう

> 小さすぎると「ウーン」とうなるだけで回らないよ。止まっているモーターが回り出すには、力がいるんだね。

:::

📷 ここに回っているモーターの写真：軸にテープの目印をつけて、回り方が見えるようにしたところ

---

# 2つのモーターを動かそう

:::

2つのモーターを、車のタイヤだと思って動かしてみよう。

1. 「**ボタンAが押されたとき**」… M1 と M2 を **正転**、スピード 150（前へ）
2. 「**ボタンBが押されたとき**」… M1 と M2 を **逆転**、スピード 150（うしろへ）
3. 「**ボタンA+Bが押されたとき**」… M1 と M2 を **止める**

> 2つの回る向きがそろわないときは、片方の線を入れかえよう。

:::

📷 ここにメイクコードの画面：ボタンA・B・A+B に、M1 と M2 のモーターのブロックを入れたところ

---

# もっとやってみよう

1. **その場で回転**：M1 を正転、M2 を逆転にすると、車はどう動くかな？
2. **だんだん速く**：「**ループ**」の「**変数 カウンター を 0〜255 に変えてくりかえす**」で、スピードに **カウンター** を入れてみよう（一時停止 20 も入れてね）
3. **ゆらしたら止まる**：「**入力**」の「**ゆさぶられたとき**」で、2つとも止めるようにしよう

> ⚠ 回っているモーターを、手でおさえて止めないでね。
