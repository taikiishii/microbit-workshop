# サーボモーターを動かそう

角度を指定してうごかそう

---

# なにをするの？

:::

サーボモーターは、**角度（0〜180度）を指定して**その位置でピタッと止まるモーターだよ。ロボットの腕やしっぽ、ハンドルなどに使えるんだ。

> ふつうのモーター（DCモーター）はぐるぐる回るけど、サーボモーターは指定したところで止められるよ。

:::

![サーボモーター](image/index/1784981860207.png)

---

# サーボモーターをつなごう

:::

サーボには **3本の線** があるよ。

1. 茶（または黒）… **GND（−）**
2. 赤 … **電源（3V）**
3. 黄（または橙）… **信号** → 端子 **P0**

マイクロビットとサーボモーターをつなぐために写真のような拡張基板を使うよ。

> ⚠ 線の色と向きに注意。わからないときはメンターと一緒に確かめよう。

:::

![拡張基板](image/index/1784981896699.png)
![P0に挿す。黒（または茶色）をGNDの側に。](image/index/1784981921157.png)
---

# マイクロビットを挿して電源をつなごう

:::

マイクロビットを拡張基板に挿して電源をつなごう

1. マイクロビットを拡張基板に挿す（向きに注意）
2. 電源ケーブルを拡張基板に挿す
3. 電源ケーブルをUSB充電器（もしくはPCのUSBポート）に挿す

:::

![接続した状態](image/index/1784984769976.png)

---

# 角度を指定して動かそう

:::

1. 「**高度なブロック**」→「**入出力端子**」をひらく
2. 「**サーボ 出力する 端子 P0 角度 90**」を「**ずっと**」に入れる
3. プログラムを書き込む
4. 拡張基板のスイッチを入れる（ON側にする）

> 💪 0度⇒60度⇒90度⇒120度⇒180度⇒0度...と自動的に動き続けるようにしてみよう

:::

![端子(P0)と角度(90)を指定](image/index/1784982278717.png)

---

# 連続して動かそう

:::

1. 「**サーボ 出力する 端子 P0 角度 0**」を「**ずっと**」に入れる
2. 「**一時停止（ミリ秒） 500**」をその下に入れる
3. 「**サーボ 出力する 端子 P0 角度 90**」をその下に入れる
4. 「**一時停止（ミリ秒） 500**」をその下に入れる
5. 「**サーボ 出力する 端子 P0 角度 180**」をその下に入れる
6. 「**一時停止（ミリ秒） 500**」をその下に入れる

> 一時停止を入れないとどうなるか見てみよう

:::

![連続的に動かす](image/index/1784984002160.png)

---

# ボタンで角度を変えよう

:::

1. 「**ボタンAが押されたとき**」で角度を **0** に
2. 「**ボタンBが押されたとき**」で角度を **90** に
3. 「**ボタンA+Bが押されたとき**」で角度を **180** に

> 💪 通信と組み合わせて、ボタンを押すと他のマイクロビットにつないだサーボモータが動くようにしてみよう

:::

![ボタンで角度を指定](image/index/1784983142338.png)
