# ☀️ 明るさをはかろう

---

# なにをするの？

:::

マイクロビットは、まわりの **明るさ** をはかれるよ。

じつは、**25個のLED画面そのもの**が光センサーになっているんだ。光を出すLEDが、光を感じる「目」にもなるんだよ。

- 明るさは **0〜255** の数字で出てくる
- **暗いほど 0 に近く**、明るいほど大きな数字になる

夜になると自動でつく **街灯（がいとう）** も、同じしくみだよ。今回は「**暗くなったら光るライト**」を作ってみよう！

:::

![LED画面のところで明るさをはかるよ](image/index/microbit_front.png)

---

# ① 明るさを数字で見よう

:::

まずは、今の明るさがどんな数字なのか見てみよう。

1. 「**入力**」から「**ボタンAが押されたとき**」を置く
2. 「**基本**」から「**数を表示**」を、その中にドラッグ
3. 「**入力**」から「**明るさ**」を、「数を表示」の数字のところにドラッグ
4. 「**ダウンロード**」で書きこんで、**Aボタン**を押してみよう

> 手でLED画面をおおったり、ライトを当てたりしてから Aボタンを押すと、数字が変わるよ。どのくらいの数字になったか、おぼえておいてね。

:::

![「ボタンAが押されたとき」の中に「数を表示」、その数字のところに「明るさ」](image/index/s03_show_number.png)

---

# ② 暗くなったら光らせよう

:::

「**もし** 暗かったら光る、**でなければ** 消す」プログラムにするよ。暗い＝明るさが 50 より小さい、と決めるよ。

1. 「**論理**」の「**もし〜なら〜でなければ**」を「**ずっと**」の中に入れる
2. 「**論理**」の「**くらべる**」から「**0 ＜ 0**」を「もし」のところに入れる
3. 左の 0 に「**入力**」の「**明るさ**」、右の 0 に `50` を入れる
4. 「もし〜なら」に「**アイコンを表示**」、「でなければ」に「**表示を消す**」を入れる

> 「もし〜なら」は、条件によって動きを変えるブロックだよ。

:::

![「ずっと」の中に「もし 明るさ ＜ 50 なら アイコンを表示 でなければ 表示を消す」](image/index/s04_if_dark.png)

---

# ③ ためしてみよう

「**ダウンロード**」で書きこんだら、LED画面を手でおおってみよう。

- **手でおおう**と… ハートが光る
- **手をどける**と… 消える

> 部屋の明るさによって、ちょうどいい数字はちがうよ。①で見た数字を思い出して、`50` を大きくしたり小さくしたりしてみよう。

> ⚠ 書きこんだ直後の一瞬だけ、明るさが 0 になることがあるよ。少し待ってからためしてね。

---

# もっとやってみよう

> 💪 **宝箱アラーム**：「もし 明るさ **＞** 50 なら」に変えて、中に「**音楽**」の「**鳴らす**」を入れよう。箱に入れてフタを開けると、光が入って音が鳴るよ！

> 💪 **明るさメーター**：「**LED**」の「**棒グラフを表示する**」に「明るさ」を入れると、明るさがグラフで見えるよ。最大値は `255` にしよう。

> 💪 **明るさテルミン**：「**音楽**」で音を鳴らすとき、音の高さに「明るさ」を使ってみよう。手を近づけたり遠ざけたりすると、音が変わるよ。低すぎたら「**計算**」の「**×**」で何倍かにしてみてね。
