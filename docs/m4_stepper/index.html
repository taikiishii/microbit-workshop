# 🎯 ステッピングモーターを回そう

決めた角度だけ、正確に回そう

---

# なにをするの？

:::

**ステッピングモーター** は、**少しずつ（1ステップずつ）** 回るモーターだよ。何ステップ回すかで、**角度を正確に** 決められるんだ。プリンターや、カメラのピント合わせに使われているよ。

- 今回使う **28BYJ-48** は、およそ **2048 ステップで1周**
- 1ステップは、たったの **0.18度** くらい

> DCモーターは「回し続ける」、ステッピングモーターは「決めた分だけ回す」のが得意だよ。

:::

📷 ここに 28BYJ-48 の写真：改造ずみで、線が4本（青・桃・黄・橙）のもの

---

# このモーターは改造してあるよ

:::

28BYJ-48 は、そのままではこの基板で回せない形（**ユニポーラ**）になっているんだ。中の配線を1か所切って、**バイポーラ** という形にしてあるよ。

1. モーターの横の、青いプラスチックのカバーをはずす
2. 中の小さな基板で、赤い線につながっている配線をカッターで切り、2つのコイルを切りはなす
3. 赤い線は使わない（切るか、テープでとめておく）
4. **青・黄** が1組、**桃・橙** がもう1組のコイルになる

> ⚠ 改造は大人の作業だよ。ワークショップでは、改造ずみのモーターを使うよ。

:::

📷 ここに改造のようす：青いカバーをはずして、切る配線がわかる写真

---

# モーターをつなごう

:::

ステッピングモーター1台で、**M1 と M2 の2つ分** を使うよ。これを「**STEP1**」とよぶよ。

1. **青** と **黄** の線を、M1 の **1A+** と **1A−** に
2. **桃** と **橙** の線を、M2 の **1B+** と **1B−** に
3. ねじをしめて、抜けないか確かめる

> 回る向きが反対になったときは、あとで出てくる「**回転方向反転**」で直せるよ。

:::

📷 ここに 28BYJ-48 を M1・M2 につないだ写真：青・黄が M1、桃・橙が M2

---

# はじめの設定をしよう

:::

モーターのことを、マイクロビットに教えておくよ。

1. 「**DFモーター**」の「**ステッピング STEP1 の初期設定**」を「**最初だけ**」に入れる
2. 「**1周のステップ数**」を **2048**、「**回転方向反転**」を **偽**、「**最速速度（ステップ/秒）**」を **400** にする

> 「1周のステップ数」は、何ステップで1周するかを教える数だよ。

:::

📷 ここにメイクコードの画面：「最初だけ」に「ステッピング STEP1 の初期設定」（2048・偽・400）

---

# ボタンで1周回そう

:::

1. 「**ボタンAが押されたとき**」に「**ステッピング STEP1 を 時計回り に回す**」を入れる
2. ブロックの **⊕** をクリックして、**角度 360**、**速度 400**、「**終わるまで待つ**」にする
3. 書きこんで、基板のスイッチを **ON** にしてから A を押す
4. 「**ボタンBが押されたとき**」に、**反時計回り** に **90 度** も作ってみよう

> 回った角度がわかるように、軸にテープで目印をつけておこう。

:::

📷 ここにメイクコードの画面：「最初だけ」に初期設定、ボタンA に「時計回り・角度 360・速度 400・終わるまで待つ」

---

# ぴったり1周に合わせよう

:::

360度回したのに、目印が少し行きすぎたり、足りなかったりしないかな？

1. A を何回か押して、目印がどれくらいずれるか見る
2. 行きすぎるときは「**1周のステップ数**」を **小さく**、足りないときは **大きく** する
3. 書きこんでためす、をくりかえして、ぴったり1周になる数をさがそう

> 基板の中の「時計」には少しずつクセがあるんだ。だから、ぴったりの数は基板ごとに少しちがうよ。

:::

📷 ここに目印をつけたモーターの写真：軸のテープと、本体の目印がそろっているところ

---

# 速さを変えてみよう

:::

1. 初期設定の「**最速速度**」を **1000** にする
2. ボタンA の「**速度**」を **200 → 400 → 600 → 800** と変えて、ためしてみる
3. どこまで速くできるかな？

> 速すぎると、モーターがついていけずに、ブルブルふるえるだけになるよ。これを「**脱調（だっちょう）**」というんだ。

:::

📷 ここにメイクコードの画面：「最速速度」を 1000、ボタンA の速度を 600 にしたところ

---

# もっとやってみよう

1. **回し続ける**：角度を **0** にすると、「**ステッピング STEP1 を止める**」まで回り続けるよ。A で回して、B で止めるようにしよう
2. **時計の秒針**：「ずっと」の中で **6度** ずつ回して、一時停止を入れて、1分で1周するようにしてみよう
3. **2台を同時に回す**：2台目を M3（**2A**）と M4（**2B**）につないで「**STEP2**」として使おう。STEP1 を「**待たずに次へ**」にすると、2台が同時に回るよ。向きは、同じにも反対にもできるよ

> ⚠ 2台を同時に回すと、**速さは同じ** になるよ（あとから回したほうの速度にそろう）。速度は同じ数にしておこう。また、ステッピングモーターが回っているあいだは **サーボは動かない** よ（サーボのブロックを使うと LED に「!」が出る）。
