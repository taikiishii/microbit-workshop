# 🪄 おぼえた動きでプログラムしよう

AI とメイクコードを組み合わせよう

---

# なにをするの？

:::

「AIに動きをおぼえさせよう」で作った **モデル** を、**メイクコード** から使うよ。

- 「ふる」と表示が変わる、「たたく」と音が鳴る、といったプログラムが作れる
- メイクコードに「**機械学習**」というメニューがふえる

> 前の章のプロジェクトが残っているパソコンで続けよう。消えていたら、もう一度データを集めてね。

:::

![メニューのいちばん上に「機械学習」がふえる](image/index/s02_ml_menu.png)

---

# メイクコードをひらこう

:::

1. CreateAI のテスト画面で「**MakeCodeで編集**」をクリック
2. 説明が出るので「**閉じる**」
3. メイクコードがひらいて、アクションごとに「**ML の ◯◯ が開始したとき**」のブロックが **もう並んでいる**。中には「アイコンを表示」が入っているよ

> この「◯◯ が開始したとき」は、ボタンの「押されたとき」と同じ **〜とき** のブロックだよ。AI が動きを見つけた瞬間に動くんだ。

:::

![最初に出る説明。「閉じる」でとじる](image/index/s03_makecode_first.png)
![アクションごとに「ML の ◯◯ が開始したとき」が並んでいる](image/index/s03b_makecode.png)

---

# 動きごとに表示と音を変えよう

:::

1. 「ふる」のブロックのアイコンを、**すきなアイコン** に変える
2. 「たたく」の「アイコンを表示」を、「**音楽**」の「**鳴らす**」に入れかえる
3. 「じっと」のブロックは「**表示を消す**」に変える

> 3つの動きで、3つのちがう反応。自分だけの反応を考えてみよう。

:::

![ふるでアイコン、たたくでメロディ、じっとで表示を消す](image/index/s04_icons_sound.png)

---

# 書きこもう

1. 「**ダウンロード**」をクリック
2. **記録用（v2）** のマイクロビットを USB につないで書きこむ
3. 書きこめたら **電池ボックス** につなぎかえて、動かしてみよう

>| ⚠ 書きこむと、マイクロビットの中の **データ収集プログラムは消える** よ。データを足したくなったら、CreateAI でもう一度「接続」からやり直そう。

> ⚠ ここで **保存** を押して、プロジェクトをファイルにしておくと安心だよ。

---

# たたいた回数を数えよう

:::

「たたく」を認識するたびに **1 増える** カウンターを作ろう。「変数を使おう」の復習だよ。

1. 「**変数**」で `count` を作る
2. 「ML の たたく が開始したとき」の中に「**変数 count を 1 だけ増やす**」と「**数を表示 count**」を入れる
3. 書きこんで、机をトントンたたいてみよう

> 💪 「ジャンプ」のアクションを足せば、**なわとびカウンター** になるよ。

:::

![「たたく」を認識するたびに count が 1 増えて表示される](image/index/s06_counter.png)

---

# もっとやってみよう

>| 💪 **動きで楽器**：アクションごとにちがう音を鳴らそう。「ふる」でド、「たたく」でソ、のように。

>| 💪 「**ML ◯◯ を認識中なら**」ブロックを使うと、**動いているあいだだけ** 光らせられるよ。「ずっと」と「もし」で作ってみよう。

>| 💪 **無線で知らせよう**。動きを認識したら「無線」で数字を送って、はなれたマイクロビットに表示させよう。「無線で通信しよう」を思い出してね。
