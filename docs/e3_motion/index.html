# ③ 人感センサーを使ってみよう

人を検知して光や音で知らせよう

---

# なにをするの？

:::

**人感センサー**は、人が動いたことを **赤外線** で検知するセンサーだよ。トイレやげんかんの **自動照明** などに使われているんだ。

今回は、人を検知したら **micro:bit の LED表示を変えたり、音を鳴らしたり** してみよう。

- センサーは **TFW-RK2 ボード** についているよ
- ボードは micro:bit に **パチッと取り付けるだけ**（配線はいらないよ）

:::

📷 ここに TFW-RK2 ／ 人感センサーの写真を貼り付け

---

# 拡張機能を組み込もう

:::

人感センサーを使うには、TFabWorks の **「STEM」拡張機能** を追加するよ。

1. 画面右上の **歯車（設定）** → 「**拡張機能**」をクリック
2. けんさく欄に `tfabworks/pxt-stem` を入力してさがす
3. 出てきた **STEM** をクリックして追加
4. メニューに「**STEM**」がふえる

> かんたんな方法：ブラウザで **https://tfab.jp/stem** を開くと、最初から「STEM」が入ったプロジェクトになるよ。

:::

📷 ここに拡張機能の追加画面を貼り付け

---

# 人を検知したらLEDを変えよう

:::

1. 「**ずっと**」ブロックを用意する
2. 「**論理**」の「**もし〜なら〜でなければ**」を入れる
3. 「**STEM**」から **人感センサー（人を検知した）** のブロックを条件に入れる
4. 検知したら「**アイコンを表示**」、そうでなければ「**画面を消す**」

> ⚠ ブロックの正確な名前は実機のMakeCodeで確認して調整してね。

:::

📷 ここにプログラム画面を貼り付け

---

# 音を出そう

:::

人を検知したときに、音も鳴らしてみよう。

1. さっきの「もし〜なら」の中に、「**音楽**」の「**鳴らす**」ブロックを追加
2. 好きな音やメロディーをえらぶ

> 💪 やってみよう！　検知したときだけ短く「ピッ」と鳴らすには、どうすればいいかな？

:::

📷 ここにプログラム画面を貼り付け

---

# もっとやってみよう

:::

（ここにチャレンジを書く）

- 人が **何回** 通ったかを **変数** で数えて、LEDに表示する
- 「**明るさ**」も調べて、**暗いとき＋人がいるとき**だけ点灯する（自動照明！）

> 💪 本物のトイレ照明みたいに、人がいなくなったら少ししてから消せるかな？

:::
