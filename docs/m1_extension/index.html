# 🧰 モーター基板の拡張機能を入れよう

ブロックを追加して、モーターを動かす準備をしよう

---

# なにをするの？

:::

モーター編では、**モーター基板** を使って、3種類のモーターを動かすよ。

- **サーボモーター** … 角度を決めて、そこで止まる
- **DCモーター** … ぐるぐる回り続ける
- **ステッピングモーター** … 少しずつ、正確に回る

メイクコードには、この基板を動かすブロックがはじめは入っていないんだ。**拡張機能** を追加すると、新しいブロックが使えるようになるよ。

:::

📷 ここに3種類のモーターを並べた写真：サーボ（ES08MA II）、130 サイズの DCモーター、28BYJ-48

---

# モーター基板を見てみよう

:::

拡張編のサーボでも使った基板だよ。今回は、ほかの端子も使うよ。

- **M1〜M4**（上の緑のねじの端子）… DCモーターをつなぐ。ステッピングモーターは2つ分（M1＋M2）を使う
- **S1〜S8**（まん中のピンの列）… サーボモーターをつなぐ
- **電源の差しこみ口とスイッチ**（右）… モーターを動かす電気を入れる

> マイクロビットの電気だけではモーターは回せないから、基板に電源をつなぐんだよ。

:::

![上のねじの端子が M1〜M4、まん中のピンの列が S1〜S8](image/index/s02_board.png)

---

# マイクロビットを挿して電源をつなごう

:::

1. マイクロビットを基板に挿す（写真と同じ向き）
2. 電源ケーブルを基板に挿す
3. 電源ケーブルを USB 充電器（または PC の USB）に挿す
4. 基板のスイッチは、まだ **OFF** のまま

> ⚠ プログラムを書きこんでから、スイッチを ON にしよう。モーターが急に動き出さないようにするためだよ。

:::

![マイクロビットを挿して、電源ケーブルをつないだところ](image/index/s04_power.png)

---

# 拡張機能を追加しよう

:::

1. メイクコードで「**新しいプロジェクト**」を作る
2. ブロックの一覧のいちばん下にある「**拡張機能**」をクリック
3. 上の検索らんに、下のアドレスをはりつけて検索する
4. 出てきた「**dfmotor-ja**」のカードをクリック

```
https://github.com/taikiishii/pxt-dfmotor-ja
```

> カードに「利用者が提供した拡張機能…」と出るけど、だいじょうぶ。

:::

📷 ここに拡張機能の画面：検索らんにアドレスを入れて、「dfmotor-ja」のカードが出たところ

---

# ブロックがふえたか見てみよう

:::

ブロックの一覧に、むらさきの「**DFモーター**」がふえていれば成功！ クリックして中を見てみよう。

- 「**モーター**」… DCモーター用
- 「**サーボ**」… サーボモーター用
- 「**ステッピング**」… ステッピングモーター用

> ⚠ 拡張機能は **プロジェクトごと** に追加するよ。新しいプロジェクトを作ったら、また追加しよう。

:::

📷 ここに「DFモーター」を開いたところ：むらさきのブロックが並んでいる画面

---

# うまくいかないとき

- **カードが出てこない** … インターネットにつながっているか、アドレスがまちがっていないか（前やうしろに余分な文字がないか）を確かめよう
- **ブロックが英語になっている** … メイクコードの言語が日本語になっているか確かめよう（右上の ⚙ →「**言語を変える**」）
- **モーターが動かない** … 基板のスイッチが ON になっているか、電源ケーブルがつながっているかを確かめよう

> これで準備はOK！ 次は、サーボモーターを動かしてみよう。
