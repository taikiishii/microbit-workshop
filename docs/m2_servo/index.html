# 🦾 モーター基板でサーボを動かそう

S1〜S8 につないで、いくつも動かそう

---

# なにをするの？

:::

拡張編では、サーボを **P0** の端子につないで動かしたね。今回は、モーター基板の **S1〜S8** につなぐよ。

- サーボを **8個まで** つないで、べつべつに動かせる
- 角度は拡張編と同じ **0〜180度**
- ブロックは「**DFモーター**」の「**サーボ**」を使う

> 前の章の拡張機能を追加したプロジェクトで進めよう。

:::

![今回も使うサーボモーター](image/index/s02_servo.png)

---

# サーボをつなごう

:::

**S1** の列に挿すよ。ピンは3本で、色が決まっているよ。

1. 茶（または黒）の線 … **GND**（黒いピン）
2. 赤の線 … **VIN**（赤いピン）
3. 黄（またはオレンジ）の線 … **S**（緑のピン）

> ⚠ 茶色の線を黒いピンの側にそろえよう。わからないときはメンターと一緒に確かめよう。

:::

📷 ここにサーボを S1 に挿した写真：茶が GND（黒いピン）、赤が VIN（赤いピン）、黄が S（緑のピン）

---

# 角度を決めて動かそう

:::

1. 「**DFモーター**」の「**サーボ S1 の角度を 90 度にする**」を「**最初だけ**」に入れる
2. 「**ダウンロード**」で書きこむ
3. 基板のスイッチを **ON** にする
4. 角度を **0** や **180** に変えて、もう一度書きこんでみよう

> スイッチを入れたままでも、書きこむとそのまま新しいプログラムで動くよ。

:::

📷 ここにメイクコードの画面：「最初だけ」に「サーボ S1 の角度を 90 度にする」

---

# 順番に動かそう

:::

1. 「**サーボ S1 の角度を 0 度にする**」を「**ずっと**」に入れる
2. 「**基本**」の「**一時停止（ミリ秒） 500**」をその下に入れる
3. 同じように、**90 度** → 一時停止 → **180 度** → 一時停止 と続ける
4. 書きこんで、動きを見てみよう

> 一時停止がないと、サーボが動ききる前に次の角度になってしまうよ。

:::

📷 ここにメイクコードの画面：「ずっと」の中に 0度・90度・180度と一時停止 500 を交互に入れたところ

---

# 2つを同時に動かそう

:::

サーボをもう1つ、**S2** に挿そう。

1. 「**ボタンAが押されたとき**」に、「**サーボ S1 の角度を 0 度にする**」と「**サーボ S2 の角度を 180 度にする**」
2. 「**ボタンBが押されたとき**」に、S1 を **180 度**、S2 を **0 度**
3. 書きこんで、A と B を押してみよう

> ブロックの S1 を S2 に変えるだけで、べつのサーボを動かせるよ。

:::

📷 ここにメイクコードの画面：ボタンA と ボタンB のそれぞれに、S1 と S2 のサーボのブロック

---

# もっとやってみよう

1. **ワイパー**：「ずっと」の中で、S1 と S2 を同じ向きに 0度 ↔ 180度 と往復させよう
2. **ゆっくり動かす**：「**ループ**」の「**変数 カウンター を 0〜180 に変えてくりかえす**」で、角度に **カウンター** を入れてみよう（一時停止 20 も入れてね）
3. **リモコン**：「**無線**」と組み合わせて、ほかのマイクロビットのボタンを押すとサーボが動くようにしよう

> ⚠ あとの章で使うステッピングモーターが回っているあいだは、サーボは動かないよ。くわしくはステッピングモーターの章で説明するね。
